# Render Blueprint: ONE web service runs the API and serves the React site.
services:
  - type: web
    name: royal-enterprise
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Phase 2 (add after merging the admin module):
      # - key: ADMIN_USERNAME
      #   sync: false
      # - key: ADMIN_PASSWORD
      #   sync: false
      # - key: ADMIN_TOKEN_SECRET
      #   generateValue: true
